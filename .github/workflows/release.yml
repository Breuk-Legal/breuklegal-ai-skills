name: release

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Serializa los cortes de versión: si entran varios merges seguidos, se
# encolan en vez de pisarse (nunca cancelar un release a medias).
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag-and-release:
    # En una máquina de GitHub y no en la propia: este repo es público y la
    # máquina propia no toma sus trabajos (el corte del 2026-10-31 quedó en
    # cola sin arrancar). Abrirla a repos públicos la expondría a código de
    # cualquiera; para un repo público las máquinas de GitHub son gratis.
    # El tag de acá es lo que breuklegal-ai-agent embebe con
    # scripts/sync-skills: un corte que no ocurre deja al agente publicando
    # skills viejos sin decirlo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Cada merge a main corta versión: +patch (o promueve un rc previo) y
      # tag-ea el commit actual. Consumido por breuklegal-ai-agent
      # (scripts/sync-skills) como "el último release semver" a embeber.
      - name: Tag next version
        id: tag
        run: |
          bash scripts/release
          echo "version=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        run: gh release create "${{ steps.tag.outputs.version }}" --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
